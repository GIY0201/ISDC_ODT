    <header class="window-titlebar" id="window-titlebar"><span class="window-drag-label" id="window-title" tabindex="0" role="button" aria-label="작업 창 이동">공용 상황판</span><span id="popout-feedback" class="popout-feedback" role="status" hidden></span><div class="window-actions"><button type="button" id="window-minimize" aria-label="작업 창 최소화" title="최소화">−</button><button type="button" id="window-expand" aria-label="작업 창 확장" title="확장/복원">□</button><button type="button" id="window-popout" aria-label="별도 창으로 열기" title="별도 창으로 열기">↗</button><button type="button" id="window-close" aria-label="작업 창 닫기" title="닫기">×</button></div></header>
